<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Tripod support free-body diagrams</title>
  <desc id="desc">The left diagram shows gravity and ground reactions as the whole robot's external forces. The right diagram isolates one leg, where actuator torques produce an assigned foot force.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#B5423F"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#238A4A"/></marker>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#2E69AD"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#D87B16"/></marker>
    <style>
      .frame{fill:#F5F7FA;stroke:#AAB3BF;stroke-width:2}.robot{fill:#252A31;stroke:#101216;stroke-width:3}.leg{fill:none;stroke:#252A31;stroke-width:13;stroke-linecap:round;stroke-linejoin:round}.ground{stroke:#697386;stroke-width:4}.label{font-family:Arial,sans-serif;fill:#15181D;font-size:23px}.small{font-family:Arial,sans-serif;fill:#454E5C;font-size:19px}.red{fill:#B5423F;font-weight:bold}.green{fill:#238A4A;font-weight:bold}.blue{fill:#2E69AD;font-weight:bold}.orange{fill:#D87B16;font-weight:bold}.force{stroke:#238A4A;stroke-width:6;marker-end:url(#arrow-green)}.friction{stroke:#2E69AD;stroke-width:6;marker-end:url(#arrow-blue)}.weight{stroke:#B5423F;stroke-width:6;marker-end:url(#arrow-red)}.torque{stroke:#D87B16;stroke-width:6;fill:none;marker-end:url(#arrow-orange)}
    </style>
  </defs>
  <rect class="frame" x="15" y="15" width="1170" height="650" rx="16"/>
  <text class="label" x="50" y="60" font-weight="bold">Whole robot — external forces only</text>
  <line class="ground" x1="50" y1="500" x2="540" y2="500"/>
  <rect class="robot" x="190" y="150" width="210" height="78" rx="14"/>
  <text class="label" x="265" y="198" fill="#FFF">body</text>
  <circle cx="295" cy="189" r="10" fill="#B5423F"/>
  <text class="label red" x="314" y="178">COM</text>
  <path class="leg" d="M225 228 L137 350 L96 490"/>
  <path class="leg" d="M295 228 L295 365 L295 490"/>
  <path class="leg" d="M365 228 L460 350 L510 490"/>
  <line class="weight" x1="295" y1="200" x2="295" y2="330"/>
  <text class="label red" x="314" y="310">mg</text>
  <line class="force" x1="96" y1="485" x2="96" y2="370"/><text class="label green" x="55" y="360">f₁z</text>
  <line class="force" x1="295" y1="485" x2="295" y2="370"/><text class="label green" x="310" y="360">f₂z</text>
  <line class="force" x1="510" y1="485" x2="510" y2="315"/><text class="label green" x="466" y="305">f₃z</text>
  <line class="friction" x1="96" y1="475" x2="150" y2="475"/><text class="label blue" x="108" y="460">f₁x</text>
  <line class="friction" x1="295" y1="475" x2="345" y2="475"/><text class="label blue" x="307" y="460">f₂x</text>
  <line class="friction" x1="510" y1="475" x2="458" y2="475"/><text class="label blue" x="420" y="460">f₃x</text>
  <text class="small" x="50" y="570">Static balance: Σf = 0 and Σmoment = 0.</text>
  <text class="small" x="50" y="602">Joint torques are internal; they do not appear in this whole-robot diagram.</text>
  <line x1="590" y1="45" x2="590" y2="625" stroke="#AAB3BF" stroke-width="2"/>
  <text class="label" x="630" y="60" font-weight="bold">One leg — force plus actuator torques</text>
  <line class="ground" x1="630" y1="500" x2="1130" y2="500"/>
  <rect class="robot" x="770" y="150" width="190" height="70" rx="14"/>
  <text class="label" x="833" y="195" fill="#FFF">body</text>
  <path class="leg" d="M875 220 L975 350 L1025 490"/>
  <circle cx="875" cy="220" r="10" fill="#D87B16"/><text class="label orange" x="895" y="212">hip</text>
  <circle cx="975" cy="350" r="10" fill="#D87B16"/><text class="label orange" x="995" y="342">knee</text>
  <line class="force" x1="1025" y1="485" x2="1025" y2="315"/><text class="label green" x="1040" y="330">assigned f₃z</text>
  <line class="friction" x1="1020" y1="475" x2="945" y2="475"/><text class="label blue" x="862" y="460">f₃x</text>
  <path class="torque" d="M854 260 Q810 220 844 185"/><text class="label orange" x="640" y="210">tau hip</text>
  <path class="torque" d="M950 392 Q905 355 940 320"/><text class="label orange" x="760" y="350">tau knee</text>
  <text class="small" x="630" y="570">Choose the foot force from the whole-robot balance problem.</text>
  <text class="label orange" x="630" y="612">tau leg = J(q) transpose f</text>
</svg>
