<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Tripod support: forces on the robot, torques in one leg</title>
  <desc id="desc">A quiet blue engineering diagram. The left side is the whole robot free-body diagram: gravity down and ground forces up. The right side isolates one leg: an assigned ground force maps through the Jacobian transpose to hip and knee torques.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#b9cce0" stroke-opacity=".34"/></pattern>
    <marker id="arrow-navy" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#153350"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#3266d6"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L9 4L0 8Z" fill="#c46a30"/></marker>
    <style>
      .ink{stroke:#153350}.robot{fill:#153350}.link{fill:none;stroke:#153350;stroke-width:14;stroke-linecap:round;stroke-linejoin:round}.ground{stroke:#6f8eaa;stroke-width:3}.divider{stroke:#9cb6ce;stroke-width:2}.label{font-family:'JetBrains Mono',monospace;fill:#153350;font-size:20px}.small{font-family:'JetBrains Mono',monospace;fill:#466583;font-size:16px}.heading{font-family:'JetBrains Mono',monospace;fill:#153350;font-size:23px;font-weight:600}.force{stroke:#3266d6;stroke-width:6;marker-end:url(#arrow-blue)}.weight{stroke:#153350;stroke-width:6;marker-end:url(#arrow-navy)}.moment{stroke:#c46a30;stroke-width:6;fill:none;marker-end:url(#arrow-orange)}.joint{fill:#e5f0f9;stroke:#153350;stroke-width:4}.force-label{font-family:'JetBrains Mono',monospace;fill:#3266d6;font-size:18px;font-weight:600}.moment-label{font-family:'JetBrains Mono',monospace;fill:#c46a30;font-size:18px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="680" fill="#edf4fa"/>
  <rect width="1200" height="680" fill="url(#grid)"/>
  <text class="heading" x="56" y="66">WHOLE ROBOT · external forces</text>
  <text class="small" x="56" y="96">Forces from the ground balance gravity.</text>
  <text class="heading" x="656" y="66">ONE LEG · actuator torques</text>
  <text class="small" x="656" y="96">The assigned foot force becomes motor torque.</text>
  <line class="divider" x1="600" y1="48" x2="600" y2="630"/>
  <line class="ground" x1="62" y1="510" x2="546" y2="510"/>
  <line class="ground" x1="654" y1="510" x2="1138" y2="510"/>
  <rect class="robot" x="205" y="165" width="196" height="58" rx="9"/>
  <text x="259" y="201" font-family="'JetBrains Mono',monospace" font-size="18" fill="#edf4fa">chassis</text>
  <circle cx="303" cy="194" r="8" fill="#c46a30"/><text class="moment-label" x="318" y="185">COM</text>
  <path class="link" d="M244 223L151 355L111 498"/><path class="link" d="M303 223L303 372L303 498"/><path class="link" d="M362 223L458 355L502 498"/>
  <circle class="joint" cx="111" cy="498" r="7"/><circle class="joint" cx="303" cy="498" r="7"/><circle class="joint" cx="502" cy="498" r="7"/>
  <line class="weight" x1="303" y1="205" x2="303" y2="328"/><text class="label" x="318" y="306">mg</text>
  <line class="force" x1="111" y1="493" x2="111" y2="374"/><text class="force-label" x="81" y="359">f₁</text>
  <line class="force" x1="303" y1="493" x2="303" y2="374"/><text class="force-label" x="273" y="359">f₂</text>
  <line class="force" x1="502" y1="493" x2="502" y2="338"/><text class="force-label" x="472" y="323">f₃</text>
  <text class="small" x="62" y="566">external balance</text><text class="label" x="62" y="598">Σf = 0   ·   Σmoment = 0</text>
  <text class="small" x="62" y="629">Joint torque is internal to this diagram.</text>
  <rect class="robot" x="811" y="165" width="174" height="58" rx="9"/><text x="859" y="201" font-family="'JetBrains Mono',monospace" font-size="18" fill="#edf4fa">chassis</text>
  <path class="link" d="M900 223L981 352L1030 498"/><circle class="joint" cx="900" cy="223" r="10"/><circle class="joint" cx="981" cy="352" r="10"/><circle class="joint" cx="1030" cy="498" r="7"/>
  <text class="label" x="920" y="217">hip</text><text class="label" x="997" y="347">knee</text>
  <line class="force" x1="1030" y1="493" x2="1030" y2="338"/><text class="force-label" x="1044" y="359">assigned f</text>
  <path class="moment" d="M875 274Q830 225 870 187"/><text class="moment-label" x="680" y="235">τ hip</text>
  <path class="moment" d="M957 408Q916 354 954 315"/><text class="moment-label" x="700" y="375">τ knee</text>
  <text class="small" x="654" y="566">current pose sets the lever geometry</text><text class="label" x="654" y="598">τ = J(q)ᵀ f</text>
  <text class="small" x="654" y="629">Same foot force, new pose → new torque demand.</text>
</svg>
